<svg class="lab-svg-entity" data-asset-id="cawan-petri" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_cawan_petri_22899_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_cawan_petri_22899_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_cawan_petri_22899_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_cawan_petri_22899_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_cawan_petri_22899_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_cawan_petri_22899_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_cawan_petri_22899_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(8, 42)">
                        <!-- Alas Media Agar Cawan -->
                        <ellipse cx="42" cy="38" rx="38" ry="12" fill="#eab308" opacity="0.75"/>
                        <path d="M 4 38 L 4 45 Q 42 58 80 45 L 80 38 Q 42 50 4 38 Z" fill="#eab308" opacity="0.85"/>
                        <!-- Dinding Cawan Kaca Bawah -->
                        <ellipse cx="42" cy="38" rx="40" ry="13" fill="none" stroke="#334155" stroke-width="2.5"/>
                        <path d="M 2 38 L 2 46 Q 42 60 82 46 L 82 38" fill="none" stroke="#334155" stroke-width="2.5"/>
                        <!-- Tutup Cawan Kaca Atas Transparan -->
                        <ellipse cx="42" cy="32" rx="41" ry="13.5" fill="url(#svg_cawan_petri_22899_glass_body)" stroke="#334155" stroke-width="2"/>
                        <!-- Kilap Permukaan Kaca Lingkaran -->
                        <ellipse cx="40" cy="30" rx="30" ry="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
                    </g>
            </svg>