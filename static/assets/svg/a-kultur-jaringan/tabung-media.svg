<svg class="lab-svg-entity" data-asset-id="tabung-media" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_tabung_media_24019_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_tabung_media_24019_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_tabung_media_24019_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_tabung_media_24019_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_tabung_media_24019_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_tabung_media_24019_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_tabung_media_24019_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(30, 8)">
                        <!-- Tabung Reaksi Kultur Kaca Tebal -->
                        <path d="M 8 10 L 8 70 Q 20 88 32 70 L 32 10" fill="url(#svg_tabung_media_24019_glass_body)" stroke="#334155" stroke-width="2.5"/>
                        <!-- Tutup Sumbat Steril Berpori -->
                        <path d="M 6 6 L 34 6 L 32 14 L 8 14 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
                        <!-- Gel Agar Nutrisi Murashige & Skoog (MS) -->
                        <path d="M 9 46 L 31 46 L 31 69 Q 20 86 9 69 Z" fill="#eab308" opacity="0.92"/>
                        <ellipse cx="20" cy="46" rx="11" ry="3" fill="#fef08a"/>
                        <!-- Butiran Garis Vitamin & Sukrosa -->
                        <circle cx="15" cy="56" r="1.5" fill="#ca8a04"/>
                        <circle cx="24" cy="62" r="1.8" fill="#ca8a04"/>
                        <circle cx="18" cy="70" r="1.5" fill="#ca8a04"/>
                        <line x1="12" y1="18" x2="12" y2="68" stroke="#ffffff" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
                    </g>
            </svg>