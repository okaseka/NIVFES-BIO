<svg class="lab-svg-entity" data-asset-id="ovarium" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_ovarium_77149_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_ovarium_77149_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_ovarium_77149_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_ovarium_77149_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_ovarium_77149_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_ovarium_77149_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_ovarium_77149_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(12, 12)">
                        <!-- Jaringan Ovarium Merah Muda Lembut -->
                        <path d="M 20 42 C 14 20, 52 14, 64 36 C 76 58, 38 80, 20 42 Z" fill="#f472b6" stroke="#be185d" stroke-width="3"/>
                        <!-- Folikel-Folikel Telur di Dalam -->
                        <circle cx="34" cy="36" r="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
                        <circle cx="34" cy="36" r="3.5" fill="#be185d"/>
                        <circle cx="50" cy="34" r="9" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
                        <circle cx="50" cy="34" r="4" fill="#be185d"/>
                        <!-- Folikel Matang (Graaf) Siap Ovulasi Menjorok Keluar -->
                        <circle cx="54" cy="52" r="10.5" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5" filter="url(#svg_ovarium_77149_glow)"/>
                        <circle cx="54" cy="52" r="5" fill="#9f1239"/>
                    </g>
            </svg>