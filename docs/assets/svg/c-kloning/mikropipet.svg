<svg class="lab-svg-entity" data-asset-id="mikropipet" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_mikropipet_29533_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_mikropipet_29533_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_mikropipet_29533_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_mikropipet_29533_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_mikropipet_29533_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_mikropipet_29533_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_mikropipet_29533_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(32, 6)">
                        <!-- Badan Mikropipet Ergonomis -->
                        <rect x="11" y="16" width="14" height="52" rx="3.5" fill="url(#svg_mikropipet_29533_steel)" stroke="#1e293b" stroke-width="2"/>
                        <!-- Tombol Plunger Tekan Atas -->
                        <rect x="13" y="4" width="10" height="12" rx="2" fill="#ef4444" stroke="#991b1b" stroke-width="1.8"/>
                        <!-- Display Digital Volume Mikro Liter (uL) -->
                        <rect x="12" y="30" width="12" height="16" rx="1.5" fill="#020617"/>
                        <text x="18" y="42" font-size="8.5" fill="#22c55e" font-family="'JetBrains Mono', monospace" text-anchor="middle" font-weight="bold">100</text>
                        <!-- Tip Pipet Kaca Presisi -->
                        <path d="M 13 68 L 23 68 L 19 92 Q 18 94 17 92 L 13 68 Z" fill="url(#svg_mikropipet_29533_glass_body)" stroke="#475569" stroke-width="1.8"/>
                        
                    </g>
            </svg>