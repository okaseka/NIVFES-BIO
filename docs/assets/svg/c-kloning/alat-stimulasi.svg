<svg class="lab-svg-entity" data-asset-id="alat-stimulasi" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_alat_stimulasi_31125_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_alat_stimulasi_31125_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_alat_stimulasi_31125_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_alat_stimulasi_31125_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_alat_stimulasi_31125_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_alat_stimulasi_31125_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_alat_stimulasi_31125_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(8, 8)">
                        <!-- Kotak Generator Pulsa Elektrofusi -->
                        <rect x="8" y="24" width="70" height="52" rx="4.5" fill="#1e1b4b" stroke="#312e81" stroke-width="3"/>
                        <!-- Layar Digital Voltase Tinggi -->
                        <rect x="16" y="32" width="34" height="16" rx="2" fill="#020617"/>
                        <text x="33" y="44" fill="#38bdf8" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle" filter="url(#svg_alat_stimulasi_31125_glow)">2.5 kV</text>
                        <!-- Dua Jarum Elektroda Fusi -->
                        <path d="M 58 36 L 78 36 L 78 62" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M 58 44 L 70 44 L 70 62" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
                        
                    </g>
            </svg>