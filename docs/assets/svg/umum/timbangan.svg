<svg class="lab-svg-entity" data-asset-id="timbangan" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_timbangan_25689_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_timbangan_25689_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_timbangan_25689_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_timbangan_25689_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_timbangan_25689_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_timbangan_25689_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_timbangan_25689_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(8, 16)">
                        <!-- Piringan Stainless Timbangan Berkilau -->
                        <ellipse cx="42" cy="22" rx="36" ry="7" fill="url(#svg_timbangan_25689_steel)" stroke="#334155" stroke-width="2.5"/>
                        <ellipse cx="42" cy="20" rx="30" ry="5" fill="#f1f5f9" opacity="0.6"/>
                        <rect x="38" y="26" width="8" height="14" fill="#475569" stroke="#334155" stroke-width="1.5"/>
                        <!-- Chassis Konsol Timbangan Beveled -->
                        <path d="M 8 40 L 76 40 L 82 78 L 2 78 Z" fill="url(#svg_timbangan_25689_steel)" stroke="#334155" stroke-width="2.5"/>
                        <!-- Layar LCD Digital Luminous Hijau -->
                        <rect x="22" y="50" width="40" height="18" rx="3" fill="#022c22" stroke="#064e3b" stroke-width="2"/>
                        <text x="42" y="63" fill="#22c55e" font-size="11" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="bold" text-anchor="middle" filter="url(#svg_timbangan_25689_glow)">0.00 g</text>
                        <!-- Tombol Tare & Kalibrasi Berwarna -->
                        <circle cx="15" cy="59" r="3.5" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
                        <circle cx="69" cy="59" r="3.5" fill="#ea580c" stroke="#c2410c" stroke-width="1"/>
                    </g>
            </svg>