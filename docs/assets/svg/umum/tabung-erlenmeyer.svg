<svg class="lab-svg-entity" data-asset-id="tabung-erlenmeyer" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_tabung_erlenmeyer_69334_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_tabung_erlenmeyer_69334_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_tabung_erlenmeyer_69334_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_tabung_erlenmeyer_69334_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_tabung_erlenmeyer_69334_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_tabung_erlenmeyer_69334_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_tabung_erlenmeyer_69334_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(15, 6)">
                        <!-- Cairan dengan Meniskus & Gelembung Mikro -->
                        <path d="M 28 46 Q 35 44 42 46 L 64 85 Q 35 90 6 85 Z" fill="url(#svg_tabung_erlenmeyer_69334_liquid)"/>
                        <ellipse cx="35" cy="46" rx="7" ry="2" fill="#eab308" opacity="0.9"/>
                        <!-- Gelembung Mikro -->
                        <circle cx="28" cy="62" r="1.5" fill="#ffffff" opacity="0.65"/>
                        <circle cx="40" cy="72" r="2" fill="#ffffff" opacity="0.6"/>
                        <circle cx="22" cy="78" r="1.2" fill="#ffffff" opacity="0.65"/>
                        <!-- Badan Kaca Labu Erlenmeyer Tebal -->
                        <path d="M 27 14 L 27 38 L 4 84 Q 35 92 66 84 L 43 38 L 43 14 Z" 
                              fill="url(#svg_tabung_erlenmeyer_69334_glass_body)" stroke="#334155" stroke-width="2.5"/>
                        <!-- Bibir Labu Cincin Tebal -->
                        <ellipse cx="35" cy="14" rx="9" ry="3.5" fill="url(#svg_tabung_erlenmeyer_69334_steel)" stroke="#334155" stroke-width="2"/>
                        <!-- Garis Skala Pengukur Putih Bersih -->
                        <line x1="31" y1="56" x2="39" y2="56" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
                        <line x1="28" y1="66" x2="42" y2="66" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
                        <line x1="24" y1="76" x2="46" y2="76" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
                        <!-- Pantulan Cahaya Diagonal Kaca Mengilap -->
                        <path d="M 12 82 L 30 45 L 30 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
                    </g>
            </svg>