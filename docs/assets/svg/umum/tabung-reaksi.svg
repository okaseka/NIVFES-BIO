<svg class="lab-svg-entity" data-asset-id="tabung-reaksi" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_tabung_reaksi_22366_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_tabung_reaksi_22366_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_tabung_reaksi_22366_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_tabung_reaksi_22366_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_tabung_reaksi_22366_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_tabung_reaksi_22366_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_tabung_reaksi_22366_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(34, 10)">
                        <!-- Cairan dengan Meniskus -->
                        <path d="M 6 43.199999999999996 Q 16 41.199999999999996 26 43.199999999999996 L 26 70 Q 16 86 6 70 Z" fill="url(#svg_tabung_reaksi_22366_liquid)"/>
                        <ellipse cx="16" cy="43.199999999999996" rx="10" ry="2.5" fill="#eab308" opacity="0.9"/>
                        <circle cx="14" cy="55" r="1.2" fill="#ffffff" opacity="0.6"/>
                        <!-- Dinding Tabung Kaca Tebal -->
                        <path d="M 5 14 L 5 70 Q 16 88 27 70 L 27 14" 
                              fill="url(#svg_tabung_reaksi_22366_glass_body)" stroke="#334155" stroke-width="2.5"/>
                        <!-- Bibir Tabung -->
                        <ellipse cx="16" cy="14" rx="12" ry="4" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
                        <!-- Sorotan Cahaya -->
                        <line x1="8" y1="20" x2="8" y2="68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
                    </g>
            </svg>