<svg class="lab-svg-entity" data-asset-id="rak-inkubasi" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_rak_inkubasi_1351_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_rak_inkubasi_1351_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_rak_inkubasi_1351_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_rak_inkubasi_1351_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_rak_inkubasi_1351_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_rak_inkubasi_1351_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_rak_inkubasi_1351_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(8, 4)">
                        <!-- Lemari Rak Inkubasi Kultur Stainless -->
                        <rect x="6" y="8" width="72" height="80" rx="4" fill="url(#svg_rak_inkubasi_1351_steel)" stroke="#334155" stroke-width="2.5"/>
                        <!-- Jendela Pintu Kaca & Rak Dalam -->
                        <rect x="11" y="14" width="62" height="52" rx="2.5" fill="rgba(241,245,249,0.55)" stroke="#94a3b8" stroke-width="1.5"/>
                        <line x1="11" y1="38" x2="73" y2="38" stroke="#475569" stroke-width="2.5"/>
                        <!-- Tabung Kultur Mini di Rak -->
                        <rect x="18" y="22" width="6" height="15" rx="1.5" fill="#fde047" opacity="0.8"/>
                        <rect x="30" y="22" width="6" height="15" rx="1.5" fill="#fde047" opacity="0.8"/>
                        <!-- Lampu Pertumbuhan Hangat -->
                        <line x1="13" y1="17" x2="71" y2="17" stroke="#facc15" stroke-width="3" filter="url(#svg_rak_inkubasi_1351_glow)"/>
                        <line x1="13" y1="41" x2="71" y2="41" stroke="#facc15" stroke-width="3" filter="url(#svg_rak_inkubasi_1351_glow)"/>
                        <!-- Jam Pengatur Waktu Analog Berjarum -->
                        <g transform="translate(42, 76)">
                            <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
                            <line x1="0" y1="0" x2="0" y2="-6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
                            <line x1="0" y1="0" x2="5" y2="0" stroke="#22c55e" stroke-width="2" stroke-linecap="round" transform="rotate(60)"/>
                            <circle cx="0" cy="0" r="2" fill="#f8fafc"/>
                        </g>
                        <text x="20" y="80" fill="#0f172a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="bold">25°C</text>
                    </g>
            </svg>