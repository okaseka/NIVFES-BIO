<svg class="lab-svg-entity" data-asset-id="pot-tanaman" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_pot_tanaman_86723_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_pot_tanaman_86723_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_pot_tanaman_86723_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_pot_tanaman_86723_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_pot_tanaman_86723_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_pot_tanaman_86723_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_pot_tanaman_86723_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(12, 18)">
                        <!-- Tanah Gembur Kaya Humus -->
                        <ellipse cx="38" cy="30" rx="30" ry="8" fill="#451a03" stroke="#291003" stroke-width="2"/>
                        <!-- Badan Pot Terakota Bergradien -->
                        <path d="M 8 30 L 17 72 Q 38 78 59 72 L 68 30 Z" fill="#c2410c" stroke="#7c2d12" stroke-width="2.5"/>
                        <!-- Bibir Atas Pot Berlekuk -->
                        <ellipse cx="38" cy="30" rx="32" ry="8.5" fill="#ea580c" stroke="#9a3412" stroke-width="2.2"/>
                        <path d="M 12 42 Q 38 48 64 42" fill="none" stroke="#9a3412" stroke-width="2"/>
                    </g>
            </svg>