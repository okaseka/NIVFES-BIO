<svg class="lab-svg-entity" data-asset-id="inkubator" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_inkubator_49243_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_inkubator_49243_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_inkubator_49243_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_inkubator_49243_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_inkubator_49243_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_inkubator_49243_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_inkubator_49243_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(8, 4)">
                        <!-- Badan Inkubator CO2 Medis Tebal -->
                        <rect x="6" y="8" width="76" height="80" rx="5" fill="#0f172a" stroke="#334155" stroke-width="3"/>
                        <!-- Pintu Kaca Berlampu LED Sian -->
                        <rect x="11" y="14" width="66" height="50" rx="3" fill="rgba(56, 189, 248, 0.16)" stroke="#38bdf8" stroke-width="2"/>
                        <line x1="13" y1="39" x2="75" y2="39" stroke="#475569" stroke-width="2.5"/>
                        <!-- Cawan Petri Mini di Dalam -->
                        <ellipse cx="44" cy="37" rx="16" ry="4.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
                        <!-- Panel Kontrol Display Digital Hijau LED -->
                        <rect x="11" y="68" width="66" height="16" rx="2.5" fill="#020617"/>
                        <text x="34" y="80" fill="#22c55e" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle" filter="url(#svg_inkubator_49243_glow)">37.0°C</text>
                        <!-- Lampu Status Berkedip -->
                        <circle cx="62" cy="76" r="3.5" fill="#ef4444" filter="url(#svg_inkubator_49243_glow)"/>
                        <circle cx="70" cy="76" r="3.5" fill="#22c55e"/>
                    </g>
            </svg>