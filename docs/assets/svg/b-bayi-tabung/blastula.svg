<svg class="lab-svg-entity" data-asset-id="blastula" viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                
            <defs>
                <!-- Gradien Kaca Realistis -->
                <linearGradient id="svg_blastula_76767_glass_body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                    <stop offset="12%" stop-color="#f0f9ff" stop-opacity="0.35"/>
                    <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
                    <stop offset="88%" stop-color="#bae6fd" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
                </linearGradient>
                <linearGradient id="svg_blastula_76767_glass_highlight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
                </linearGradient>

                <!-- Gradien Logam & Stainless Steel -->
                <linearGradient id="svg_blastula_76767_steel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="25%" stop-color="#e2e8f0"/>
                    <stop offset="55%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="svg_blastula_76767_metal_bevel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#334155"/>
                </linearGradient>

                <!-- Gradien Cairan Dinamis -->
                <linearGradient id="svg_blastula_76767_liquid" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
                    <stop offset="15%" stop-color="#eab308" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#eab308" stop-opacity="0.95"/>
                </linearGradient>

                <!-- Filter Glow LED & Lampu -->
                <filter id="svg_blastula_76767_glow" x="-25%" y="-25%" width="150%" height="150%">
                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="svg_blastula_76767_soft_shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
                </filter>
            </defs>
                
                    <g transform="translate(16, 16)">
                        <!-- Rongga Blastocoel Embrio Hari ke-5 -->
                        <circle cx="34" cy="34" r="30" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/>
                        <!-- Lapisan Sel Trofoblas Melingkar -->
                        <circle cx="56" cy="34" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="50.85297774861752" cy="48.141327413103866" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="37.82025990867247" cy="55.66577056626858" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="23.000000000000007" cy="53.05255888325765" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="13.326762342710015" cy="41.52444315316472" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="13.326762342710015" cy="26.47555684683529" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="22.99999999999999" cy="14.947441116742354" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="37.82025990867246" cy="12.334229433731423" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/><circle cx="50.85297774861751" cy="19.858672586896127" r="5" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5"/>
                        <!-- Massa Sel Dalam (Inner Cell Mass - Bakal Janin) -->
                        <g transform="translate(26, 26)">
                            <circle cx="4" cy="4" r="4.5" fill="#be185d"/>
                            <circle cx="10" cy="5" r="4" fill="#be185d"/>
                            <circle cx="5" cy="10" r="4" fill="#be185d"/>
                            <circle cx="11" cy="11" r="3.5" fill="#be185d"/>
                        </g>
                    </g>
            </svg>