                        <line x1="16" y1="43" x2="30" y2="43" stroke="#ef4444" stroke-width="2.5"/>
                        <line x1="16" y1="65" x2="30" y2="65" stroke="#f59e0b" stroke-width="2.5"/>
                        <line x1="21" y1="76" x2="25" y2="76" stroke="#10b981" stroke-width="2.5"/>
