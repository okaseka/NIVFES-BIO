<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVFES BIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        h1, h2, h3, .nav-brand { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .tab-content { transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/simulator.css">
    <script src="js/theme.js" defer></script>
    <script src="js/svg-objects.js" defer></script>
    <script src="js/assets.config.js" defer></script>
    <script src="js/motion.js" defer></script>
    <script src="js/simulator.js" defer></script>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50 border-b border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="home.html" class="nav-brand text-2xl font-bold text-teal-600">NIVFES BIO</a>
            <div class="flex items-center gap-4">
                <a href="katalog.html" target="_blank" class="text-xs bg-teal-50 text-teal-700 hover:bg-teal-100 font-semibold px-3 py-1.5 rounded-lg border border-teal-200 transition flex items-center gap-1.5">
                    <span>🎨</span> Katalog Objek SVG
                </a>
                <div class="text-right text-sm">
                    <p class="font-bold text-slate-800" id="nav-nama"></p>
                    <p class="text-slate-500" id="nav-npm"></p>
                </div>
                <a href="#" onclick="doLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-semibold hover:bg-red-100 text-sm">Keluar</a>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto pt-24 px-4 sm:px-6 pb-12 flex-grow w-full" id="module-main">
        <!-- Diisi oleh JavaScript -->
        <div class="text-center py-20 text-slate-500">Memuat modul...</div>
    </main>
    
    <!-- Footer & Feedback -->
    <footer class="border-t border-slate-200 bg-white py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-6 flex flex-col items-center">
            <div class="w-full max-w-md mb-6">
                <h4 class="text-center font-bold text-slate-700 mb-2">Beri Masukan (Feedback)</h4>
                <div class="flex gap-2">
                    <input type="text" id="feedback-input" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-teal-500" placeholder="Ketik masukan Anda di sini...">
                    <button onclick="sendFeedback()" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-teal-700">Kirim</button>
                </div>
                <p id="feedback-msg" class="text-emerald-600 text-xs text-center mt-2 hidden">Terima kasih atas masukannya!</p>
            </div>
            <div class="text-center text-slate-500 text-sm">
                &copy; NIVFES BIO.
            </div>
        </div>
    </footer>

    <script>
        // === AUTH CHECK ===
        const nivfesNama = localStorage.getItem('nivfes_nama');
        const nivfesNpm = localStorage.getItem('nivfes_npm');
        if (!nivfesNama || !nivfesNpm) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('nav-nama').textContent = nivfesNama;
            document.getElementById('nav-npm').textContent = nivfesNpm;
        }

        function doLogout() {
            localStorage.removeItem('nivfes_nama');
            localStorage.removeItem('nivfes_npm');
            window.location.href = 'index.html';
        }

        // === LOAD MODULE ===
        const params = new URLSearchParams(window.location.search);
        const moduleId = params.get('id');

        if (!moduleId) {
            window.location.href = 'home.html';
        }

        fetch('data/modules.json')
            .then(r => r.json())
            .then(modules => {
                const mod = modules.find(m => m.id === moduleId);
                if (!mod) {
                    document.getElementById('module-main').innerHTML = '<div class="text-center py-20 text-red-500 font-bold text-xl">Modul tidak ditemukan.</div>';
                    return;
                }

                document.title = `${mod.title} - NIVFES BIO`;

                // Acak dan batasi 20 soal
                let quizzes = [...mod.quizzes];
                for (let i = quizzes.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [quizzes[i], quizzes[j]] = [quizzes[j], quizzes[i]];
                }
                quizzes = quizzes.slice(0, 20);

                // Render module page
                const main = document.getElementById('module-main');
                main.innerHTML = `
                <div class="mb-8">
                    <a href="home.html" class="text-teal-600 hover:text-teal-700 font-semibold text-sm flex items-center gap-2 mb-4 transition">
                        <span>&larr;</span> Kembali ke Beranda
                    </a>
                    <h1 class="text-4xl font-extrabold text-slate-800 mb-2 flex items-center gap-3">
                        <span>${mod.icon}</span> ${mod.title}
                    </h1>
                    <p class="text-slate-500 text-lg">${mod.summary}</p>
                </div>

                <!-- Container Tab Utama -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col md:flex-row min-h-[720px] relative transition-all duration-300">
                    
                    <!-- Sidebar Navigasi Tab -->
                    <div id="module-sidebar" class="w-full md:w-64 flex-shrink-0 bg-slate-50 border-r border-slate-200 p-5 flex flex-col gap-3 transition-all duration-300">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-1">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Menu Praktikum</span>
                            <button id="btn-toggle-sidebar" onclick="toggleSidebar()" class="hidden md:inline-flex items-center text-xs font-bold text-slate-400 hover:text-teal-600 transition" title="Sembunyikan / Tampilkan Panel">
                                <span>◀ Sembunyikan</span>
                            </button>
                        </div>
                        <button onclick="switchTab('teori', this)" class="tab-btn text-left px-4 py-3 rounded-xl text-teal-600 border border-teal-600 font-semibold bg-white shadow-sm transition-all flex items-center gap-2">
                            <span>📖</span> <span>Teori</span>
                        </button>
                        <button onclick="switchTab('prosedur', this)" class="tab-btn text-left px-4 py-3 rounded-xl text-slate-500 border border-transparent font-medium hover:bg-slate-100 transition-all flex items-center gap-2">
                            <span>⚙️</span> <span>Prosedur</span>
                        </button>
                        <button onclick="switchTab('simulator', this)" class="tab-btn text-left px-4 py-3 rounded-xl text-slate-500 border border-transparent font-medium hover:bg-slate-100 transition-all flex items-center gap-2">
                            <span>🔬</span> <span>Simulator (Lab)</span>
                        </button>
                        <button onclick="switchTab('kuis', this)" class="tab-btn text-left px-4 py-3 rounded-xl text-slate-500 border border-transparent font-medium hover:bg-slate-100 transition-all flex items-center gap-2">
                            <span>📝</span> <span>Evaluasi</span>
                        </button>
                    </div>

                    <!-- Area Konten Tab -->
                    <div class="relative w-full h-full p-4 sm:p-6 lg:p-8 overflow-y-auto flex-grow flex flex-col">
                        <!-- Floating Expand/Restore Sidebar Button -->
                        <button id="btn-restore-sidebar" onclick="toggleSidebar()" class="hidden fixed bottom-6 left-6 z-40 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl shadow-lg border border-teal-500 items-center gap-1.5 transition">
                            <span>▶</span> Tampilkan Menu
                        </button>
                        
                        <!-- 1. TAB TEORI -->
                        <div id="tab-teori" class="tab-content block opacity-100 translate-y-0 visible pointer-events-auto transition-all duration-300">
                            <h3 class="text-2xl font-bold text-slate-800 mb-6">Teori Dasar</h3>
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="lg:col-span-2 text-slate-700 leading-relaxed text-lg">
                                    <p>${mod.theory}</p>
                                </div>
                                <div class="bg-white rounded-xl p-2 flex flex-col items-center justify-center border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                                    <img src="images/${mod.id}.png" alt="Gambar ${mod.title}" class="w-full h-full object-contain rounded">
                                </div>
                            </div>
                        </div>

                        <!-- 2. TAB PROSEDUR -->
                        <div id="tab-prosedur" class="tab-content hidden opacity-0 translate-y-4 invisible pointer-events-none transition-all duration-300">
                            <h3 class="text-2xl font-bold text-slate-800 mb-6">Langkah-langkah Prosedur</h3>
                            <ol class="space-y-4">
                                ${mod.procedure.map(step => `
                                <li class="flex gap-4 p-4 bg-slate-50 rounded-lg border border-slate-100">
                                    <div class="flex-shrink-0 w-8 h-8 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center font-bold shadow-sm">
                                        &check;
                                    </div>
                                    <p class="text-slate-700 pt-1 leading-relaxed">${step}</p>
                                </li>
                                `).join('')}
                            </ol>
                        </div>

                        <!-- 3. TAB SIMULATOR -->
                        <div id="tab-simulator" class="tab-content hidden opacity-0 translate-y-4 invisible pointer-events-none h-full flex flex-col transition-all duration-300 relative">
                            <div id="sim-container" data-module="${mod.id}" class="w-full">
                                <!-- Virtual Lab dirender oleh simulator.js -->
                            </div>
                        </div>

                        <!-- 4. TAB KUIS -->
                        <div id="tab-kuis" class="tab-content hidden opacity-0 translate-y-4 invisible pointer-events-none transition-all duration-300">
                            <h3 class="text-2xl font-bold text-slate-800 mb-6">Evaluasi Pemahaman</h3>
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-8 shadow-inner" id="quiz-container" data-module="${mod.id}">
                                ${quizzes.map((quiz, i) => `
                                <div class="quiz-item ${i !== 0 ? 'hidden' : ''}" data-answer="${quiz.answer}">
                                    <p class="text-xl font-semibold text-slate-800 mb-6">${quiz.question}</p>
                                    <div class="space-y-3 mb-6">
                                        ${quiz.options.map((opt, j) => `
                                        <label class="flex items-center gap-3 p-4 bg-white border border-slate-200 rounded-lg cursor-pointer hover:bg-teal-50 hover:border-teal-300 transition-colors shadow-sm">
                                            <input type="radio" name="q${i}" value="${j}" class="w-5 h-5 text-teal-600 focus:ring-teal-500">
                                            <span class="text-slate-700 font-medium">${opt}</span>
                                        </label>
                                        `).join('')}
                                    </div>
                                    <button onclick="checkAnswer(this)" class="bg-teal-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-teal-700 transition shadow-md">Jawab</button>
                                    <div class="feedback hidden mt-4 p-4 rounded-lg font-bold text-center text-lg border"></div>
                                </div>
                                `).join('')}
                                
                                <!-- Hasil Akhir & Submit Skor -->
                                <div id="quiz-finish" class="hidden text-center py-6">
                                    <div class="text-6xl mb-4">🏆</div>
                                    <h3 class="text-3xl font-bold text-slate-800">Kuis Selesai!</h3>
                                    <p class="text-xl mt-4 font-semibold text-slate-600">Skor Anda: <span id="final-score-display" class="text-teal-600 text-5xl ml-2 block mt-2">0</span></p>
                                    
                                    <div id="submit-score-section" class="mt-8 max-w-sm mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <label class="block text-left text-sm font-bold text-slate-700 mb-2">Simpan ke Papan Peringkat:</label>
                                        <input type="text" id="player-name" placeholder="Masukkan Nama Anda..." value="${localStorage.getItem('nivfes_nama') || ''}" class="w-full border border-slate-300 p-3 rounded-lg mb-3 focus:ring-2 focus:ring-teal-500 outline-none">
                                        <button onclick="submitScore()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-700 transition">Kirim Skor</button>
                                    </div>

                                    <!-- Leaderboard UI -->
                                    <div id="leaderboard-section" class="mt-10 hidden text-left max-w-md mx-auto">
                                        <h4 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><span>🥇</span> Top 5 Papan Peringkat</h4>
                                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                            <ul id="leaderboard-list" class="divide-y divide-slate-100">
                                                <!-- Diisi oleh JS -->
                                            </ul>
                                        </div>
                                        <button onclick="location.reload()" class="w-full mt-6 bg-white border-2 border-slate-300 text-slate-700 py-3 rounded-lg font-bold hover:bg-slate-50 transition shadow-sm">Ulangi Modul</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                `;
            });

        // === FEEDBACK ===
        function sendFeedback() {
            const inputField = document.getElementById('feedback-input');
            const successMsg = document.getElementById('feedback-msg');
            if (!inputField || !inputField.value.trim()) {
                alert("Masukan tidak boleh kosong!");
                return;
            }
            const feedbacks = JSON.parse(localStorage.getItem('nivfes_feedbacks') || '[]');
            feedbacks.push({
                npm: localStorage.getItem('nivfes_npm'),
                nama: localStorage.getItem('nivfes_nama'),
                message: inputField.value.trim(),
                waktu: new Date().toLocaleString('id-ID')
            });
            localStorage.setItem('nivfes_feedbacks', JSON.stringify(feedbacks));
            successMsg.classList.remove('hidden');
            inputField.value = '';
            setTimeout(() => { successMsg.classList.add('hidden'); }, 3000);
        }
    </script>
</body>
</html>
