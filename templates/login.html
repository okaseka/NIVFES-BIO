<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - NIVFES BIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F8FAFC; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-teal-600 mb-2">NIVFES BIO</h1>
            <p class="text-slate-500 text-sm">Masukkan identitas.</p>
        </div>
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" name="nama" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-teal-500" placeholder="Nama">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">NPM / NIS</label>
                <input type="text" name="npm" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-teal-500" placeholder="12345678">
            </div>
            <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2 rounded-lg hover:bg-teal-700 transition">Masuk</button>
        </form>
    </div>
</body>
</html>
